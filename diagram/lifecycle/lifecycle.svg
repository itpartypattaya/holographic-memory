<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 610">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- transitions -->
  <line x1="99" y1="300" x2="258" y2="300" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 320 255 C 315 185, 405 185, 400 253" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="360" y1="345" x2="360" y2="448" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-violet)"/>
  <path d="M 460 270 L 560 270 L 560 135 L 618 135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 620 165 L 590 165 L 590 285 L 462 285" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="460" y1="318" x2="618" y2="318" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 460 335 L 490 335 L 490 465 L 618 465" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <line x1="840" y1="465" x2="866" y2="465" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <!-- transition labels -->
  <text x="178" y="282" fill="#93c5fd" font-size="8.5" font-weight="600" text-anchor="middle">memory_add · import</text>
  <text x="178" y="294" fill="#93c5fd" font-size="8.5" font-weight="600" text-anchor="middle">· auto_extract</text>
  <text x="178" y="318" fill="#94a3b8" font-size="8" text-anchor="middle">write screen: no secret,</text>
  <text x="178" y="330" fill="#94a3b8" font-size="8" text-anchor="middle">no instruction, no markup</text>
  <text x="360" y="160" fill="#93c5fd" font-size="8.5" font-weight="600" text-anchor="middle">memory_change: it changed</text>
  <text x="360" y="173" fill="#93c5fd" font-size="8.5" font-weight="600" text-anchor="middle">memory_correct: it was wrong</text>
  <text x="350" y="395" fill="#c4b5fd" font-size="8" text-anchor="end">the old text, dated</text>
  <text x="350" y="407" fill="#c4b5fd" font-size="8" text-anchor="end">(a wrong one never as the past)</text>
  <text x="508" y="262" fill="#94a3b8" font-size="8.5" font-weight="600" text-anchor="middle">memory_end</text>
  <text x="525" y="300" fill="#94a3b8" font-size="8">revert · change</text>
  <text x="540" y="332" fill="#94a3b8" font-size="8.5" font-weight="600" text-anchor="middle">memory_merge</text>
  <text x="555" y="457" fill="#fda4af" font-size="8.5" font-weight="600" text-anchor="middle">memory_forget</text>

  <!-- start -->
  <circle cx="90" cy="300" r="9" fill="#60a5fa"/>

  <!-- current -->
  <rect x="260" y="255" width="200" height="90" rx="14" fill="#0f172a"/>
  <rect x="260" y="255" width="200" height="90" rx="14" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="360" y="281" fill="white" font-size="12" font-weight="600" text-anchor="middle">current fact</text>
  <text x="360" y="299" fill="#94a3b8" font-size="8.5" text-anchor="middle">#id · trust · keywords</text>
  <text x="360" y="313" fill="#94a3b8" font-size="8.5" text-anchor="middle">entities · vector (opt.)</text>
  <text x="360" y="330" fill="#6ee7b7" font-size="8.5" text-anchor="middle">recalled and searched</text>

  <!-- history -->
  <rect x="260" y="450" width="200" height="74" rx="6" fill="#0f172a"/>
  <rect x="260" y="450" width="200" height="74" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="360" y="473" fill="white" font-size="11" font-weight="600" text-anchor="middle">past versions</text>
  <text x="360" y="490" fill="#94a3b8" font-size="8.5" text-anchor="middle">memory_history · revert</text>
  <text x="360" y="504" fill="#94a3b8" font-size="8.5" text-anchor="middle">search as_of a day</text>
  <text x="360" y="517" fill="#94a3b8" font-size="8.5" text-anchor="middle">its text again → a hint: change</text>

  <!-- ended -->
  <rect x="620" y="105" width="220" height="74" rx="14" fill="#0f172a"/>
  <rect x="620" y="105" width="220" height="74" rx="14" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="730" y="130" fill="white" font-size="11" font-weight="600" text-anchor="middle">ended</text>
  <text x="730" y="148" fill="#94a3b8" font-size="8.5" text-anchor="middle">no longer true, nothing replaces it</text>
  <text x="730" y="162" fill="#94a3b8" font-size="8.5" text-anchor="middle">not recalled; as_of still finds it</text>

  <!-- merged -->
  <rect x="620" y="275" width="220" height="80" rx="14" fill="#0f172a"/>
  <rect x="620" y="275" width="220" height="80" rx="14" fill="rgba(251,146,60,0.25)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="730" y="299" fill="white" font-size="11" font-weight="600" text-anchor="middle">part of #keep</text>
  <text x="730" y="316" fill="#94a3b8" font-size="8.5" text-anchor="middle">search shows one fact; its history</text>
  <text x="730" y="330" fill="#94a3b8" font-size="8.5" text-anchor="middle">and sources stay under #keep</text>
  <text x="730" y="345" fill="#fdba74" font-size="8.5" text-anchor="middle">its text again → "merged", not new</text>

  <!-- forgotten -->
  <rect x="620" y="428" width="220" height="74" rx="14" fill="#0f172a"/>
  <rect x="620" y="428" width="220" height="74" rx="14" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="730" y="452" fill="white" font-size="11" font-weight="600" text-anchor="middle">forgotten</text>
  <text x="730" y="470" fill="#94a3b8" font-size="8.5" text-anchor="middle">deleted with its whole history,</text>
  <text x="730" y="484" fill="#94a3b8" font-size="8.5" text-anchor="middle">vector and recall trace</text>
  <text x="730" y="497" fill="#fda4af" font-size="8.5" text-anchor="middle">a tombstone without text remains</text>

  <!-- final -->
  <circle cx="878" cy="465" r="11" fill="none" stroke="#fb7185" stroke-width="1.5"/>
  <circle cx="878" cy="465" r="6" fill="#fb7185"/>

  <!-- side panel -->
  <g transform="translate(880, 105)">
    <rect x="0" y="0" width="230" height="312" rx="8" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="14" y="22" fill="#e2e8f0" font-size="9.5" font-weight="600">Changes that keep the state</text>
    <text x="14" y="46" fill="#93c5fd" font-size="8.5" font-weight="600">memory_update</text>
    <text x="14" y="60" fill="#94a3b8" font-size="8">keywords, category; the fact's</text>
    <text x="14" y="72" fill="#94a3b8" font-size="8">age is kept for keywords alone</text>
    <text x="14" y="96" fill="#93c5fd" font-size="8.5" font-weight="600">memory_feedback</text>
    <text x="14" y="110" fill="#94a3b8" font-size="8">helpful / unhelpful moves trust;</text>
    <text x="14" y="122" fill="#94a3b8" font-size="8">confirmed: the person said it again</text>
    <text x="14" y="146" fill="#93c5fd" font-size="8.5" font-weight="600">memory_entity</text>
    <text x="14" y="160" fill="#94a3b8" font-size="8">alias · rename · delete · split</text>
    <text x="14" y="172" fill="#94a3b8" font-size="8">names, never the facts</text>
    <text x="14" y="196" fill="#93c5fd" font-size="8.5" font-weight="600">memory_review</text>
    <text x="14" y="210" fill="#94a3b8" font-size="8">low trust, never recalled,</text>
    <text x="14" y="222" fill="#94a3b8" font-size="8">near-duplicates to merge;</text>
    <text x="14" y="234" fill="#94a3b8" font-size="8">it changes nothing itself</text>
    <text x="14" y="258" fill="#93c5fd" font-size="8.5" font-weight="600">memory_contradict</text>
    <text x="14" y="272" fill="#94a3b8" font-size="8">pairs of current facts that say</text>
    <text x="14" y="284" fill="#94a3b8" font-size="8">different things, for the person</text>
    <text x="14" y="296" fill="#94a3b8" font-size="8">to judge; changes nothing</text>
  </g>

  <!-- title -->
  <text x="20" y="34" fill="white" font-size="16" font-weight="700">The life of a fact</text>
  <text x="20" y="54" fill="#94a3b8" font-size="10">Every change is a dated version: what held when stays answerable, and only memory_forget erases</text>
  <text x="20" y="580" fill="#64748b" font-size="8.5">With embeddings on, a new or changed text gets its vector in the background (MCP server) or by holomem embed.</text>
</svg>
