<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. region -->
  <rect x="20" y="72" width="890" height="440" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="32" y="503" fill="#fbbf24" font-size="9" font-weight="600">your machine: local by default, no network unless embeddings = true</text>

  <!-- 3. connections -->
  <!-- clients to the bus -->
  <line x1="220" y1="142" x2="248" y2="142" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="220" y1="322" x2="248" y2="322" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <!-- bus to hook and server -->
  <line x1="258" y1="142" x2="298" y2="142" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="258" y1="317" x2="298" y2="317" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <!-- bridge to engine -->
  <line x1="500" y1="142" x2="558" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="317" x2="558" y2="317" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="452" x2="558" y2="452" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- engine to store -->
  <line x1="730" y1="146" x2="768" y2="146" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <!-- hook to state.db, over the top -->
  <path d="M 450 100 L 450 84 L 900 84 L 900 300 L 892 300" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-violet)" stroke-opacity="0.8"/>
  <!-- engine to the embeddings endpoint -->
  <line x1="730" y1="437" x2="948" y2="437" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-rose)"/>

  <!-- arrow labels -->
  <text x="279" y="134" fill="#fdba74" font-size="7.5" text-anchor="middle">hook</text>
  <text x="279" y="309" fill="#fdba74" font-size="7.5" text-anchor="middle">MCP</text>
  <text x="529" y="134" fill="#94a3b8" font-size="7.5" text-anchor="middle">recall</text>
  <text x="529" y="309" fill="#94a3b8" font-size="7.5" text-anchor="middle">tools</text>
  <text x="529" y="444" fill="#94a3b8" font-size="7.5" text-anchor="middle">import</text>
  <text x="675" y="78" fill="#c4b5fd" font-size="7.5" text-anchor="middle">turns · repeat window · pause after a failed endpoint</text>
  <text x="840" y="428" fill="#fda4af" font-size="7.5" text-anchor="middle">fact texts, messages</text>
  <text x="840" y="451" fill="#fda4af" font-size="7.5" text-anchor="middle">(never a secret)</text>

  <!-- the bus bar -->
  <rect x="249" y="112" width="9" height="240" rx="3" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>

  <!-- 4+5. components -->
  <!-- clients -->
  <rect x="50" y="110" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="50" y="110" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135" y="136" fill="white" font-size="12" font-weight="600" text-anchor="middle">Claude Code</text>
  <text x="135" y="153" fill="#94a3b8" font-size="9" text-anchor="middle">CLI · Desktop · IDE</text>

  <rect x="50" y="290" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="50" y="290" width="170" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135" y="316" fill="white" font-size="12" font-weight="600" text-anchor="middle">Codex CLI</text>
  <text x="135" y="333" fill="#94a3b8" font-size="9" text-anchor="middle">hooks trusted in /hooks</text>

  <rect x="50" y="420" width="170" height="64" rx="6" fill="#0f172a"/>
  <rect x="50" y="420" width="170" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="446" fill="white" font-size="11" font-weight="600" text-anchor="middle">config.toml + .env</text>
  <text x="135" y="463" fill="#94a3b8" font-size="9" text-anchor="middle">~/.holographic/</text>

  <!-- bridge -->
  <rect x="300" y="100" width="200" height="84" rx="6" fill="#0f172a"/>
  <rect x="300" y="100" width="200" height="84" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="124" fill="white" font-size="12" font-weight="600" text-anchor="middle">holomem hook</text>
  <text x="400" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">a new process per prompt</text>
  <text x="400" y="157" fill="#94a3b8" font-size="9" text-anchor="middle">facts before the message</text>
  <text x="400" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">session block · ≤ 8 s · exit 0</text>

  <rect x="300" y="270" width="200" height="94" rx="6" fill="#0f172a"/>
  <rect x="300" y="270" width="200" height="94" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="294" fill="white" font-size="12" font-weight="600" text-anchor="middle">holomem mcp</text>
  <text x="400" y="312" fill="#94a3b8" font-size="9" text-anchor="middle">stdio server, one per session</text>
  <text x="400" y="327" fill="#94a3b8" font-size="9" text-anchor="middle">20 memory_* tools</text>
  <text x="400" y="342" fill="#94a3b8" font-size="9" text-anchor="middle">background: fact vectors</text>
  <text x="400" y="355" fill="#64748b" font-size="8" text-anchor="middle">(embeddings on)</text>

  <rect x="300" y="420" width="200" height="64" rx="6" fill="#0f172a"/>
  <rect x="300" y="420" width="200" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="445" fill="white" font-size="12" font-weight="600" text-anchor="middle">holomem CLI</text>
  <text x="400" y="462" fill="#94a3b8" font-size="9" text-anchor="middle">install · import · embed · status</text>

  <!-- engine -->
  <rect x="560" y="100" width="170" height="384" rx="8" fill="#0f172a"/>
  <rect x="560" y="100" width="170" height="384" rx="8" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="122" fill="white" font-size="12" font-weight="600" text-anchor="middle">engine</text>
  <text x="645" y="137" fill="#94a3b8" font-size="8.5" text-anchor="middle">plugin v0.24.0, byte for byte</text>

  <rect x="575" y="152" width="140" height="46" rx="5" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
  <text x="645" y="171" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">search by words</text>
  <text x="645" y="186" fill="#94a3b8" font-size="8" text-anchor="middle">FTS5 · 18 languages · HRR</text>

  <rect x="575" y="210" width="140" height="46" rx="5" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
  <text x="645" y="229" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">entities</text>
  <text x="645" y="244" fill="#94a3b8" font-size="8" text-anchor="middle">names · aliases · links</text>

  <rect x="575" y="268" width="140" height="46" rx="5" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="645" y="287" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">screens</text>
  <text x="645" y="302" fill="#94a3b8" font-size="8" text-anchor="middle">no secrets · no orders</text>

  <rect x="575" y="326" width="140" height="46" rx="5" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
  <text x="645" y="345" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">history</text>
  <text x="645" y="360" fill="#94a3b8" font-size="8" text-anchor="middle">versions · merge · trust</text>

  <rect x="575" y="414" width="140" height="46" rx="5" fill="rgba(136,19,55,0.2)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="645" y="433" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">search by meaning</text>
  <text x="645" y="448" fill="#94a3b8" font-size="8" text-anchor="middle">vectors · off by default</text>

  <!-- stores -->
  <g transform="translate(770, 110)">
    <rect x="0" y="10" width="120" height="70" rx="2" fill="#0f172a"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="#0f172a"/>
    <ellipse cx="60" cy="80" rx="60" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="120" height="70" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="60" cy="80" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="rgba(76,29,149,0.55)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="80" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="120" y1="10" x2="120" y2="80" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="38" fill="white" font-size="10" font-weight="600" text-anchor="middle">memory_store.db</text>
    <text x="60" y="53" fill="#c4b5fd" font-size="8" text-anchor="middle">facts · history</text>
    <text x="60" y="64" fill="#c4b5fd" font-size="8" text-anchor="middle">· vectors</text>
  </g>

  <g transform="translate(770, 262)">
    <rect x="0" y="10" width="120" height="70" rx="2" fill="#0f172a"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="#0f172a"/>
    <ellipse cx="60" cy="80" rx="60" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="120" height="70" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="60" cy="80" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="rgba(76,29,149,0.55)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="80" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="120" y1="10" x2="120" y2="80" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="38" fill="white" font-size="10" font-weight="600" text-anchor="middle">state.db</text>
    <text x="60" y="53" fill="#c4b5fd" font-size="8" text-anchor="middle">the bridge's own</text>
    <text x="60" y="64" fill="#c4b5fd" font-size="8" text-anchor="middle">bookkeeping</text>
  </g>

  <!-- outside: the endpoint -->
  <rect x="950" y="395" width="200" height="84" rx="6" fill="#0f172a"/>
  <rect x="950" y="395" width="200" height="84" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="1050" y="419" fill="white" font-size="11" font-weight="600" text-anchor="middle">embeddings endpoint</text>
  <text x="1050" y="437" fill="#94a3b8" font-size="9" text-anchor="middle">OpenAI-compatible API</text>
  <text x="1050" y="452" fill="#94a3b8" font-size="9" text-anchor="middle">key from ~/.holographic/.env</text>
  <text x="1050" y="468" fill="#fb7185" font-size="8.5" font-weight="600" text-anchor="middle">ONLINE · opt-in</text>

  <!-- 7. legend -->
  <g transform="translate(950, 110)">
    <text x="0" y="0" fill="#e2e8f0" font-size="9" font-weight="600">Legend</text>
    <rect x="0" y="12" width="14" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="22" y="21" fill="#94a3b8" font-size="8.5">agent (client)</text>
    <rect x="0" y="32" width="14" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="22" y="41" fill="#94a3b8" font-size="8.5">holomem process</text>
    <rect x="0" y="52" width="14" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="22" y="61" fill="#94a3b8" font-size="8.5">SQLite file</text>
    <rect x="0" y="72" width="14" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-dasharray="3,2"/>
    <text x="22" y="81" fill="#94a3b8" font-size="8.5">online, off by default</text>
    <line x1="0" y1="98" x2="14" y2="98" stroke="#fb923c" stroke-width="1.5"/>
    <text x="22" y="101" fill="#94a3b8" font-size="8.5">hook JSON / MCP stdio</text>
  </g>

  <!-- 8. title -->
  <text x="20" y="34" fill="white" font-size="16" font-weight="700">holographic-memory: architecture</text>
  <text x="20" y="54" fill="#94a3b8" font-size="10">One local fact store for Claude Code and Codex CLI, through hooks and an MCP server</text>
  <text x="20" y="540" fill="#64748b" font-size="8.5">One store for both agents by default (scope = "global"); scope = "project" keeps one per git root in ~/.holographic/projects/</text>
</svg>
