[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "holographic-memory"
version = "0.0.1"
description = "Holographic memory (local SQLite fact store with FTS5, trust scoring and HRR recall) for Claude Code and Codex CLI"
requires-python = ">=3.11"
license = { text = "MIT" }
# The engine's dependencies
dependencies = [
    "numpy>=1.26,<3",
    "snowballstemmer>=2.2,<4",
]

[project.scripts]
holomem = "holomem.__main__:main"

[tool.setuptools.packages.find]
include = ["holomem*"]

[tool.setuptools.package-data]
"holomem.engine" = ["LICENSE", "LICENSES/*", "dictionaries/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "RUF100"]
ignore = ["E501", "B905"]
